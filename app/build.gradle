plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gikoko.giai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gikoko.giai'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    def ksFile = file('ci.keystore')
    def ksStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'gikoko2026'
    def ksKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'gikoko'
    def ksKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: 'gikoko2026'
    signingConfigs {
        ci {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig signingConfigs.ci
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
