name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/GIkokoOneRecap-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIkokoOneRecap-debug
          path: out/GIkokoOneRecap-debug.apk

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" out/GIkokoOneRecap-debug.apk \
            --title "GIkoko One Recap $TAG" \
            --notes "One-click AI video recap with Myanmar voice and captions. Debug APK." \
            --target "$GITHUB_SHA" || true

      - name: Post build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# CI build failed - debug log"
            echo
            tail -n 300 build.log || true
          } > /tmp/body.md
          gh issue create --title "CI build failed - debug log" --body-file /tmp/body.md || true
