name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -storepass gikoko123 -keypass gikoko123 \
            -alias gikoko -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GIkoko One Recap, OU=Mobile, O=GiKoko, L=Yangon, C=MM"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/GIkokoOneRecap-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIkokoOneRecap-release
          path: out/GIkokoOneRecap-release.apk

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" out/GIkokoOneRecap-release.apk \
            --title "GIkoko One Recap $TAG" \
            --notes "One-click AI video recap with Myanmar voice and captions. Release-signed APK." \
            --target "$GITHUB_SHA" || true

      - name: Post build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# CI build failed - debug log"
            echo
            tail -n 400 build.log || true
          } > /tmp/body.md
          gh issue create --title "CI build failed - debug log" --body-file /tmp/body.md || true
