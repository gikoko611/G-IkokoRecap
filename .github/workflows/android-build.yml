name: Android CI Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate or restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/ci.keystore
            echo "Using persistent Android signing keystore from repository secret."
          else
            keytool -genkeypair -v \
              -keystore app/ci.keystore \
              -storepass gikoko2026 -keypass gikoko2026 \
              -alias gikoko -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GI AI, OU=AI, O=GIkoko, L=Yangon, C=MM"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured. Temporary signing key."
          fi

      - name: Build release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/G-I-AI-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-I-AI-release
          path: out/G-I-AI-release.apk

      - name: Create or update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          gh release create "$TAG" out/G-I-AI-release.apk \
            --title "G.I AI $TAG" \
            --notes "G.I AI 1.0.0" \
            --target "$GITHUB_SHA" || gh release upload "$TAG" out/G-I-AI-release.apk --clobber

      - name: Commit build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 300 build.log > ci_log.md || echo "no build.log" > ci_log.md
          git config user.name "giai-ci"
          git config user.email "giai-ci@users.noreply.github.com"
          git add ci_log.md
          git commit -m "CI failure log [skip ci]"
          git push origin HEAD:main || true
