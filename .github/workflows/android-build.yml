name: Android CI Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore app/ci.keystore \
            -storepass gikoko2026 -keypass gikoko2026 \
            -alias gikoko -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GIkoko, OU=Recap, O=GIkoko, L=Yangon, C=MM"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/GIKOKO-RECAP-release.apk

      - name: Verify signature
        shell: bash
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs out/GIKOKO-RECAP-release.apk | head -n 5 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIKOKO-RECAP-release
          path: out/GIKOKO-RECAP-release.apk

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.0.1"
          gh release create "$TAG" out/GIKOKO-RECAP-release.apk \
            --title "GIKOKO RECAP $TAG" \
            --notes "GIKOKO RECAP 0.0.1: Edge TTS, Tools page, watermark remover, usage tracker, SRT export, thumbnail maker. Myanmar AI voice + captions video recap." \
            --target "$GITHUB_SHA" || true

      - name: Post build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# CI build failed - debug log"
            echo
            tail -n 400 build.log || true
            echo
            grep -n -i "error\|FAILED" build.log | tail -n 40 || true
          } > /tmp/body.md
          gh issue create --title "CI build failed - debug log" --body-file /tmp/body.md || true
