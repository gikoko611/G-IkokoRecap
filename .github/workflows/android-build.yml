name: Android CI Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate or restore signing keystore
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/ci.keystore
            echo "Using persistent Android signing keystore from repository secret."
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore app/ci.keystore \
              -storepass gikoko2026 -keypass gikoko2026 \
              -alias gikoko -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GIkoko, OU=Recap, O=GIkoko, L=Yangon, C=MM"
            echo "persistent=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured. This APK is temporary-signed; the Release asset will be withheld to protect future in-place updates."
          fi

      - name: Build release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/GIKOKO-RECAP-release.apk

      - name: Verify signature
        shell: bash
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs out/GIKOKO-RECAP-release.apk | head -n 5 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIKOKO-RECAP-release
          path: out/GIKOKO-RECAP-release.apk

      - name: Create or update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.0.5"
          gh release create "$TAG" out/GIKOKO-RECAP-release.apk \
            --title "GIKOKO RECAP $TAG" \
            --notes "GIKOKO RECAP 0.0.5: Professional Smart Reliability Engine — persistent WorkManager jobs for video/text/queues, duplicate protection, Gemini API model discovery and failover, resumable chunk uploads, 47-hour File API checkpoints, 7-day AI plan checkpoints, TTS/frame cache, queue resume, low-RAM adaptive rendering, MP4/SRT/audio validation and completion notifications. Existing recap, drama browser, subtitles, voice and local Media3 rendering retained. IMPORTANT: This build uses the current CI signing key; configure a permanent signing key before relying on in-place upgrades." \
            --target "$GITHUB_SHA" || gh release upload "$TAG" out/GIKOKO-RECAP-release.apk --clobber

      - name: Post build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# CI build failed - debug log"
            echo
            tail -n 400 build.log || true
            echo
            grep -n -i "error\|FAILED" build.log | tail -n 40 || true
          } > /tmp/body.md
          gh issue create --title "CI build failed - debug log" --body-file /tmp/body.md || true
