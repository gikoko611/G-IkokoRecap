name: Dev Build Check
on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Dev build failed - debug log"
            echo
            tail -n 400 build.log || true
            echo
            grep -n -i "error\|FAILED" build.log | tail -n 40 || true
          } > /tmp/body.md
          gh issue create --title "Dev build failed - debug log" --body-file /tmp/body.md || true
